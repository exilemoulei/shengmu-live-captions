<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TARGET STREAM</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10231c; color: #d8ffe8; font-family: Georgia, serif; }
    main { text-align: center; }
    h1 { font-size: 64px; margin: 0; letter-spacing: 4px; }
    p { font-size: 22px; opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>TARGET STREAM</h1>
    <p id="status">Starting target audio...</p>
  </main>
  <audio id="audio" src="/assets/target.wav" autoplay loop></audio>
  <script>
    const audio = document.getElementById("audio");
    const status = document.getElementById("status");
    audio.addEventListener("play", () => status.textContent = "Target audio playing");
    audio.play().catch((error) => status.textContent = error.message);
  </script>
</body>
</html>
