<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TARGET STREAM</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10231c; color: #d8ffe8; font-family: Georgia, serif; }
    main { text-align: center; }
    h1 { font-size: 64px; margin: 0; letter-spacing: 4px; }
    p { font-size: 22px; opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>TARGET STREAM</h1>
    <p id="status">Starting target audio...</p>
  </main>
  <audio id="audio" src="/assets/target.wav" preload="auto" autoplay loop></audio>
  <script>
    const audio = document.getElementById("audio");
    const status = document.getElementById("status");
    const qualityUrl = new URLSearchParams(location.search).get("quality");
    let lastAudioError = "";

    const playbackState = () => ({
      currentTime: Number.isFinite(audio.currentTime) ? audio.currentTime : 0,
      duration: Number.isFinite(audio.duration) ? audio.duration : null,
      paused: audio.paused,
      ended: audio.ended,
      readyState: audio.readyState,
      networkState: audio.networkState,
      error: lastAudioError || audio.error?.message || null
    });

    const waitForAudio = (eventName, timeoutMs = 30000) =>
      new Promise((resolve, reject) => {
        if (eventName === "loadedmetadata" && audio.readyState >= 1) {
          resolve();
          return;
        }
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error(`timed out waiting for ${eventName}`));
        }, timeoutMs);
        const cleanup = () => {
          clearTimeout(timer);
          audio.removeEventListener(eventName, onReady);
          audio.removeEventListener("error", onError);
        };
        const onReady = () => {
          cleanup();
          resolve();
        };
        const onError = () => {
          cleanup();
          reject(audio.error || new Error("audio element failed"));
        };
        audio.addEventListener(eventName, onReady, { once: true });
        audio.addEventListener("error", onError, { once: true });
      });

    audio.addEventListener("play", () => {
      status.textContent = "Target audio playing";
    });
    audio.addEventListener("error", () => {
      lastAudioError = audio.error?.message || "audio element error";
      status.textContent = lastAudioError;
    });

    window.startQualityAudio = async (url = qualityUrl) => {
      if (!url) throw new Error("quality audio URL is required");
      if (window.__qualityAudioPlayback) {
        window.__qualityAudioPlayback.pause();
      }
      audio.pause();
      const absoluteUrl = new URL(url, location.href).href;
      if (audio.src !== absoluteUrl) {
        audio.src = absoluteUrl;
        audio.load();
      }
      audio.loop = false;
      audio.preload = "auto";
      await waitForAudio("loadedmetadata");
      audio.currentTime = 0;
      window.__qualityAudioPlayback = null;
      status.textContent = "Quality audio ready";
      return playbackState();
    };

    if (qualityUrl) {
      audio.autoplay = false;
      audio.loop = false;
      window.startQualityAudio(qualityUrl).catch((error) => {
        lastAudioError = error?.message || String(error);
        status.textContent = lastAudioError;
      });
    } else {
      audio.play().catch((error) => {
        lastAudioError = error?.message || String(error);
        status.textContent = lastAudioError;
      });
    }
  </script>
</body>
</html>
