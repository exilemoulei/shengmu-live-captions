<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>声幕</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">声</span>
        <div>
          <strong>声幕</strong>
          <span>LIVE INTERPRETER</span>
        </div>
      </div>
      <button id="openMonitor" class="text-button" type="button">字幕记录</button>
    </header>

    <main>
      <section class="now-card">
        <p class="eyebrow">当前声源</p>
        <h1 id="tabTitle">正在读取标签页</h1>
        <p id="tabUrl" class="tab-url">Chrome tab</p>
        <div class="status-row">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusLabel">准备就绪</span>
          <span id="audioRatio" class="ratio"></span>
        </div>
        <p id="livePreview" class="live-preview" hidden></p>
      </section>

      <button id="primaryButton" class="primary-button" type="button">
        <span class="button-kicker">TAB AUDIO</span>
        <span id="primaryLabel">开始实时翻译</span>
      </button>

      <p id="errorMessage" class="error-message" role="alert" hidden></p>

      <section class="local-model" aria-label="本地模型">
        <div class="local-model-head">
          <p class="eyebrow">本地模型</p>
          <span id="localServiceBadge" class="local-badge">检测中</span>
        </div>
        <div class="local-status">
          <span>
            <b>ASR</b>
            <i id="localAsrState" class="local-state">未连接</i>
          </span>
          <span>
            <b>翻译</b>
            <i id="localTranslationState" class="local-state">未连接</i>
          </span>
        </div>
        <div class="control-row">
          <label for="localTranslationModel">翻译模型</label>
          <select id="localTranslationModel"></select>
        </div>
        <div class="control-row">
          <label for="localAsrModel">ASR 模型</label>
          <select id="localAsrModel"></select>
        </div>
        <p id="localModelHint" class="field-hint"></p>
        <div id="localMissingBox" class="local-missing" hidden>
          <p id="localMissingText"></p>
          <div class="button-row">
            <a id="localDownloadPage" class="outline-button" target="_blank" rel="noreferrer">下载页</a>
            <button id="localDownloadButton" class="outline-button" type="button">下载模型</button>
          </div>
          <div id="localProgress" class="local-progress" hidden>
            <i id="localProgressBar"></i>
          </div>
          <p id="localProgressText" class="field-hint" hidden></p>
        </div>
        <div class="button-row">
          <button id="localStartButton" class="outline-button" type="button">一键启动</button>
          <button id="localStopButton" class="outline-button" type="button" disabled>停止</button>
        </div>
        <p id="localJobMessage" class="field-hint" hidden></p>
        <div id="localServiceOffline" class="local-offline" hidden>
          <p>本地控制服务未运行，在项目目录执行下面命令后点“重新检测”：</p>
          <code id="localServiceCommand"></code>
          <div class="button-row">
            <button id="copyLocalServiceCommand" class="outline-button" type="button">复制命令</button>
            <button id="retryLocalService" class="outline-button" type="button">重新检测</button>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="字幕显示设置">
        <div class="control-row">
          <label for="displayMode">显示</label>
          <select id="displayMode">
            <option value="bilingual">中英双语</option>
            <option value="dual">双行译文（上句+当前句）</option>
            <option value="chinese">仅中文</option>
            <option value="english">仅英文</option>
          </select>
        </div>
        <div class="control-row range-row">
          <label for="fontSize">字号</label>
          <input id="fontSize" type="range" min="20" max="64" step="1">
          <output id="fontSizeValue" for="fontSize">34</output>
        </div>
        <div class="control-row range-row">
          <label for="opacity">不透明度</label>
          <input id="opacity" type="range" min="5" max="100" step="1">
          <output id="opacityValue" for="opacity">86%</output>
        </div>
        <label class="switch-row">
          <span>
            <strong>页面浮层</strong>
            <small>覆盖在直播画面上；浮层上滚动滚轮可回看历史</small>
          </span>
          <input id="overlayEnabled" type="checkbox">
          <i aria-hidden="true"></i>
        </label>
        <p id="overlayHint" class="overlay-hint" role="alert" hidden>
          <span id="overlayHintText"></span>
          <button id="overlayRetry" type="button">重新注入</button>
        </p>
        <label class="switch-row">
          <span>
            <strong>自动打开记录</strong>
            <small>开始后显示字幕面板</small>
          </span>
          <input id="openPanelOnStart" type="checkbox">
          <i aria-hidden="true"></i>
        </label>
      </section>

      <details class="advanced">
        <summary>翻译引擎</summary>
        <div class="control-row">
          <label for="translationMode">来源</label>
          <select id="translationMode">
            <option value="api">API 翻译</option>
            <option value="server">本地服务端</option>
          </select>
        </div>
        <div id="apiTranslationFields">
          <div class="control-row">
            <label for="translationProvider">服务商</label>
            <select id="translationProvider">
              <option value="deepseek">DeepSeek</option>
              <option value="openai">OpenAI</option>
              <option value="custom">自定义兼容 API</option>
            </select>
          </div>
          <p class="field-hint">API 模式会把识别出的英文字幕和最近两条上下文发送给所选服务商。</p>
          <label for="translationBaseUrl">API 地址</label>
          <input id="translationBaseUrl" type="url" spellcheck="false">
          <label for="translationModel">模型</label>
          <input id="translationModel" type="text" spellcheck="false">
          <label for="translationApiKey">API Key</label>
          <input id="translationApiKey" type="password" spellcheck="false" autocomplete="off" placeholder="留空则不修改已保存的 Key">
          <p id="translationKeyHint" class="field-hint"></p>
          <label class="switch-row">
            <span>
              <strong>半句预翻译</strong>
              <small>中文更早出现，API 用量更高</small>
            </span>
            <input id="translationTranslatePartial" type="checkbox">
            <i aria-hidden="true"></i>
          </label>
          <div class="button-row">
            <button id="testTranslationButton" class="outline-button" type="button">测试翻译 API</button>
            <button id="clearTranslationKey" class="outline-button" type="button" hidden>清除 Key</button>
          </div>
          <div id="translationTestResult" class="service-results" hidden></div>
        </div>
        <p id="translationUsage" class="field-hint"></p>
      </details>

      <details class="advanced">
        <summary>术语库</summary>
        <label class="switch-row">
          <span>
            <strong>启用术语库</strong>
            <small>按句匹配专名注入翻译提示词，并为本地识别提供英文热词</small>
          </span>
          <input id="glossaryEnabled" type="checkbox">
          <i aria-hidden="true"></i>
        </label>
        <label class="switch-row">
          <span>
            <strong>流放之路 (Path of Exile 1/2)</strong>
            <small>内置 313 条国服解包官译：精魂、节杖、引路石、符文结界、焚界者、异界图鉴与同音纠错</small>
          </span>
          <input id="glossaryPresetPoe" type="checkbox">
          <i aria-hidden="true"></i>
        </label>
        <p id="glossarySummaryHint" class="field-hint"></p>
        <label for="glossaryDomainHint">领域背景提示</label>
        <input id="glossaryDomainHint" type="text" spellcheck="false" maxlength="120" placeholder="例如：Path of Exile (流放之路) 游戏直播">
        <label for="customGlossary">自定义术语（每行一条：英文 | 同音别名 -> 中文）</label>
        <textarea id="customGlossary" rows="5" spellcheck="false" placeholder="Path of Exile | Path of Excel -> 流放之路&#10;Spirit -> 精魂&#10;SSF -> SSF"></textarea>
        <div class="button-row glossary-actions">
          <button id="importGlossaryButton" class="outline-button" type="button">导入 TXT/CSV</button>
          <button id="exportGlossaryTextButton" class="outline-button" type="button">导出 TXT</button>
          <button id="exportGlossaryCsvButton" class="outline-button" type="button">导出 CSV</button>
        </div>
        <input id="importGlossaryInput" type="file" accept=".txt,.csv,text/plain,text/csv" hidden>
        <p id="glossaryActionHint" class="field-hint" hidden></p>
      </details>

      <details class="advanced">
        <summary>连接设置</summary>
        <label for="wsUrl">ASR WebSocket</label>
        <input id="wsUrl" type="url" spellcheck="false">
        <button id="probeButton" class="outline-button" type="button">检查本地服务</button>
        <div id="serviceResults" class="service-results" hidden></div>
      </details>
    </main>

    <footer>
      <span>Ctrl + Shift + Y</span>
      <button id="openMonitorFooter" class="text-button" type="button">查看全部记录</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
